name: CI

on:
  pull_request:
  # Release tags aren't built here: the Release workflow gives the tested `sha-<7>` images of the
  # release commit their version tags.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, unit tests, OpenAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before setup-node, whose pnpm cache needs pnpm on the PATH.
      # The pnpm version comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Cache entries are immutable, so each commit saves a new one and restores the latest match.
      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Regenerates openapi.json and the web client types, then fails if they differ from the commit.
      - name: Check OpenAPI spec and web client are up to date
        run: pnpm openapi:check

      # For the external test repo and reviewers. Uploaded even when the check fails, to show the
      # spec the code actually produces.
      - name: Upload OpenAPI spec
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-spec
          path: apps/api/openapi.json
          if-no-files-found: error

  integration:
    name: Integration tests
    # Stage order from the plan's definition of done: lint → typecheck → unit → integration.
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-integration-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-integration-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No TEST_* URLs are set, so the harness starts Postgres and Redis with Testcontainers
      # (Docker is preinstalled on GitHub's Ubuntu runners).
      - name: Integration tests
        run: pnpm test:integration

  guide-examples:
    name: Testing guide examples
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The rate-limit example sends it; the server gets the same value through .env.
      LOAD_TEST_KEY: ci-guide-examples-load-test-key
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-guide-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-guide-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The local setup the guide describes: .env from .env.example (test mode on, no test API key).
      - name: Configure the API
        run: |
          cp .env.example .env
          echo "LOAD_TEST_KEY=$LOAD_TEST_KEY" >> .env

      - name: Start infra
        run: pnpm infra:up

      - name: Build the API
        run: pnpm turbo run build --filter=@testtix/api...

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Start the API
        run: |
          nohup pnpm --filter @testtix/api start > api.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:3000/health/ready > /dev/null; do sleep 1; done'

      - name: Run the guide's examples
        run: pnpm docs:examples

      - name: Show API and service logs
        if: failure()
        run: |
          cat api.log
          docker compose --project-directory . -f docker/compose.yml logs --no-color

      - name: Stop infra
        if: always()
        run: pnpm infra:reset

  infra:
    name: Local infra smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm checks `engines` even for plain scripts, so Node comes from .nvmrc here too.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Start infra
        run: pnpm infra:up

      - name: Smoke test
        run: pnpm infra:check

      - name: Show service logs
        if: failure()
        run: docker compose --project-directory . -f docker/compose.yml logs --no-color

      - name: Stop infra
        if: always()
        run: pnpm infra:reset

  images:
    name: Images + full-stack smoke test
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The tag `pnpm full:up` runs and `publish` pushes under its registry names.
      TESTTIX_IMAGE_TAG: ci
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm checks `engines` even for plain scripts, so Node comes from .nvmrc here too.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # api (also run as migrate and worker), web and fake-payments.
      - name: Build the images
        run: docker compose --project-directory . -f docker/compose.yml --profile full build

      - name: Start the full stack
        run: pnpm full:up

      # Health checks, the web app and API through Caddy, and a test purchase to the e-ticket email.
      - name: Smoke test
        run: pnpm full:check

      - name: Start Prometheus and Grafana
        run: pnpm observability:up

      # Targets scraped, dashboard provisioned and its queries valid, and a short drop moves it.
      - name: Observability smoke test
        run: pnpm observability:check

      - name: Show service logs
        if: failure()
        run: docker compose --project-directory . -f docker/compose.yml --profile full --profile observability logs --no-color

      - name: Stop the full stack
        if: always()
        run: pnpm full:reset

      # The hosted demo's overlay (docker/demo/) on the same images, with DEMO_DOMAIN=localhost:
      # `edge` serves the four names with certificates from Caddy's local CA.
      - name: Start the demo setup
        run: |
          cat > .env.demo <<'EOF'
          DEMO_DOMAIN=localhost
          TEST_API_KEY=ci-demo-test-api-key
          LOAD_TEST_KEY=ci-demo-load-test-key
          PAYMENTS_API_KEY=ci-demo-payments-api-key
          PAYMENTS_WEBHOOK_SECRET=ci-demo-webhook-secret
          POSTGRES_PASSWORD=cidemo
          MAILPIT_UI_AUTH=ci:ci-demo-mail
          EOF
          docker compose -p testtix-demo --project-directory . --env-file .env.demo \
            -f docker/compose.yml -f docker/demo/compose.yml --profile full up -d --wait --no-build

      # HTTPS, what stays private, a purchase, then the nightly reset.
      - name: Demo smoke test
        env:
          DEMO_DOMAIN: localhost
          DEMO_INSECURE: 'true'
          MAILPIT_UI_AUTH: ci:ci-demo-mail
          TEST_API_KEY: ci-demo-test-api-key
          LOAD_TEST_KEY: ci-demo-load-test-key
        run: pnpm demo:check --reset

      - name: Show demo service logs
        if: failure() && hashFiles('.env.demo') != ''
        run: docker compose -p testtix-demo --project-directory . --env-file .env.demo -f docker/compose.yml -f docker/demo/compose.yml --profile full logs --no-color

      - name: Stop the demo setup
        if: always() && hashFiles('.env.demo') != ''
        run: docker compose -p testtix-demo --project-directory . --env-file .env.demo -f docker/compose.yml -f docker/demo/compose.yml --profile full down --volumes

      # `publish` pushes exactly these images, once every other job has passed.
      - name: Save the images
        if: github.event_name == 'push'
        run: docker save testtix/api:ci testtix/web:ci testtix/fake-payments:ci | zstd -T0 -3 -o images.tar.zst

      - name: Upload the images
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Push images to GHCR
    if: github.event_name == 'push'
    needs: [images, integration, guide-examples, infra]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images

      - name: Load the images
        run: zstd -dc images.tar.zst | docker load

      # ghcr.io/<owner>/testtix/{api,web,fake-payments}: `sha-<commit>` and `main`. Releases add
      # `<major>.<minor>.<patch>`, `<major>.<minor>` and `latest` (release.yml).
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}/api
            ghcr.io/${{ github.repository }}/web
            ghcr.io/${{ github.repository }}/fake-payments
          tags: |
            type=sha
            type=ref,event=branch

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r ref; do
            [[ -z "$ref" ]] && continue
            name="${ref%:*}"
            docker tag "testtix/${name##*/}:ci" "$ref"
            docker push "$ref"
          done <<< "$TAGS"
