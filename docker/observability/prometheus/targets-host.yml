# `pnpm dev` on the host (OBSERVABILITY_TARGETS=host): the API on port 3000, with the worker in
# the same process by default. The `worker` target is only up while `start:worker` runs.
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['host.docker.internal:3000']
  - job_name: worker
    static_configs:
      - targets: ['host.docker.internal:3001']
