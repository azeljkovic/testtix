# Local infrastructure for TestTix.
#
# Run from the repo root (the root `.env` overrides the defaults below):
#   pnpm infra:up      # start and wait until every service is healthy
#   pnpm infra:down    # stop, keep data
#   pnpm infra:reset   # stop and delete all data volumes
#
# Ports bind to 127.0.0.1 only, so the default credentials are never exposed on your network.
#
# fake-payments is built from apps/fake-payments/Dockerfile. After changing its code, rebuild with
#   pnpm infra:up --build
#
# Profiles:
#   full           the whole shop as containers: migrations + seed, API replicas, worker, and the web
#                  app behind Caddy (`pnpm full:up`, `pnpm full:check`; see the README)
#   observability  Prometheus + Grafana with the "Ticket drop" dashboard, for k6 runs
#                  (`pnpm observability:up`, next to `full` or `pnpm dev`; see the README)
# Services without a profile (postgres, redis, mailpit, fake-payments) always start.
#
# Images are built from the Dockerfiles, or pulled from a registry instead (`full:up` without
# `--build`): TESTTIX_IMAGE_REGISTRY=ghcr.io/azeljkovic/testtix TESTTIX_IMAGE_TAG=<tag>.

name: testtix

# The API's environment in the `full` profile, shared by migrate, api and worker. Fixed values wire
# the containers together; `${VAR:-}` passes a value from `.env` or the shell through (empty = the
# API's default, see .env.example).
x-api-environment: &api-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-testtix}:${POSTGRES_PASSWORD:-testtix}@postgres:5432/${POSTGRES_DB:-testtix}
  REDIS_URL: redis://redis:6379
  SMTP_URL: smtp://mailpit:1025
  # The web app as the browser reaches it (the `web` service's port).
  WEB_BASE_URL: http://localhost:${WEB_PORT:-5173}
  # Served over plain HTTP, where browsers would drop Secure cookies. Set true behind TLS.
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  PAYMENTS_BASE_URL: http://fake-payments:4000
  PAYMENTS_API_KEY: ${PAYMENTS_API_KEY:-sk_test_testtix_local_only}
  PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-whsec_testtix_local_only}
  # Through Caddy, so webhooks reach whichever API replica is up.
  PAYMENTS_WEBHOOK_URL: http://web:3000/webhooks/payments
  # Only Caddy reaches the API, and it sets X-Forwarded-For to the address it saw.
  TRUST_PROXY: 'true'
  WORKER_IN_PROCESS: 'false'
  TESTTIX_TEST_MODE: ${TESTTIX_TEST_MODE:-true}
  TEST_API_KEY: ${TEST_API_KEY:-}
  LOAD_TEST_KEY: ${LOAD_TEST_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-}
  HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-}
  MAIL_FROM: ${MAIL_FROM:-}
  EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-}
  HOLD_SWEEPER_ENABLED: ${HOLD_SWEEPER_ENABLED:-}
  HOLD_SWEEPER_INTERVAL_MS: ${HOLD_SWEEPER_INTERVAL_MS:-}
  PAYMENTS_TIMEOUT_MS: ${PAYMENTS_TIMEOUT_MS:-}
  PAYMENTS_WEBHOOK_TOLERANCE_SEC: ${PAYMENTS_WEBHOOK_TOLERANCE_SEC:-}
  ORDER_POLL_INTERVAL_MS: ${ORDER_POLL_INTERVAL_MS:-}
  JOB_PROCESSING_DELAY_MS: ${JOB_PROCESSING_DELAY_MS:-}
  QUEUE_ADMISSION_INTERVAL_MS: ${QUEUE_ADMISSION_INTERVAL_MS:-}
  QUEUE_POLL_INTERVAL_MS: ${QUEUE_POLL_INTERVAL_MS:-}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
  RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-}
  RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-}
  RATE_LIMIT_TEST_API: ${RATE_LIMIT_TEST_API:-}
  RATE_LIMIT_VERIFICATION_RESEND: ${RATE_LIMIT_VERIFICATION_RESEND:-}

x-api-image: &api-image
  image: ${TESTTIX_IMAGE_REGISTRY:-testtix}/api:${TESTTIX_IMAGE_TAG:-dev}
  build:
    context: .
    dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testtix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testtix}
      POSTGRES_DB: ${POSTGRES_DB:-testtix}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.34.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
      # Accept any SMTP auth (or none), so the app's SMTP settings need no real credentials.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # Fake hosted payment provider (C4.1): payment page at http://localhost:4000/pay/<session id>.
  fake-payments:
    build:
      context: .
      dockerfile: apps/fake-payments/Dockerfile
    image: ${TESTTIX_IMAGE_REGISTRY:-testtix}/fake-payments:${TESTTIX_IMAGE_TAG:-dev}
    environment:
      PUBLIC_BASE_URL: http://localhost:${FAKE_PAYMENTS_PORT:-4000}
      # The API must use the same two values (PAYMENTS_API_KEY / PAYMENTS_WEBHOOK_SECRET in `.env`).
      PAYMENTS_API_KEY: ${PAYMENTS_API_KEY:-sk_test_testtix_local_only}
      PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-whsec_testtix_local_only}
      LOG_LEVEL: ${FAKE_PAYMENTS_LOG_LEVEL:-info}
      SESSION_TTL_MINUTES: ${FAKE_PAYMENTS_SESSION_TTL_MINUTES:-30}
      DELAYED_WEBHOOK_MS: ${FAKE_PAYMENTS_DELAYED_WEBHOOK_MS:-10000}
      WEBHOOK_MAX_ATTEMPTS: ${FAKE_PAYMENTS_WEBHOOK_MAX_ATTEMPTS:-6}
      WEBHOOK_RETRY_BASE_MS: ${FAKE_PAYMENTS_WEBHOOK_RETRY_BASE_MS:-1000}
      WEBHOOK_TIMEOUT_MS: ${FAKE_PAYMENTS_WEBHOOK_TIMEOUT_MS:-5000}
    ports:
      - 127.0.0.1:${FAKE_PAYMENTS_PORT:-4000}:4000
    # Webhooks go where the API asks: to the API on the host (`pnpm dev`) at
    # http://host.docker.internal:3000/..., or to the `web` service in the `full` profile.
    # Docker Desktop provides the name; on Linux this line maps it to the host.
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # --- `full` profile -------------------------------------------------------------------------

  # Applies the migrations, then seeds the database if it is empty. Runs to completion before the
  # API and the worker start.
  migrate:
    <<: *api-image
    profiles: [full]
    command: ['sh', '-c', 'prisma migrate deploy && node dist/seed/main.js --if-empty']
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: 'no'

  # API replicas, reached only through `web` (Caddy), which spreads requests over them.
  api:
    <<: *api-image
    profiles: [full]
    environment: *api-environment
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      fake-payments:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # Background jobs (hold sweeper, order processing, e-tickets, waiting-room admission).
  worker:
    <<: *api-image
    profiles: [full]
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # Caddy: the web app at http://localhost:5173 (API under /api) and the API at http://localhost:3000,
  # the same addresses as `pnpm dev`.
  web:
    image: ${TESTTIX_IMAGE_REGISTRY:-testtix}/web:${TESTTIX_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: [full]
    ports:
      - 127.0.0.1:${WEB_PORT:-5173}:8080
      - 127.0.0.1:${PORT:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # --- `observability` profile ----------------------------------------------------------------

  # Scrapes the `full` profile's API replicas and worker every 5 s (OBSERVABILITY_TARGETS=full), or
  # `pnpm dev` on the host (OBSERVABILITY_TARGETS=host). UI at http://localhost:9090.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus/targets-${OBSERVABILITY_TARGETS:-full}.yml:/etc/prometheus/targets.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    # For OBSERVABILITY_TARGETS=host (as for fake-payments' webhooks).
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # Grafana with Prometheus and the "Ticket drop" dashboard provisioned, at http://localhost:3030.
  # Local only: anyone who reaches the port is an admin, without logging in.
  grafana:
    image: grafana/grafana:13.3.1
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ticket-drop.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3030}:3000
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  mailpit-data:
  prometheus-data:
  grafana-data:
